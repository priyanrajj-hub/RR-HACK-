apiVersion: v1
kind: ConfigMap
metadata:
  name: rr-intelligence-config
  namespace: royals-intelligence
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rr-intelligence-backend
  namespace: royals-intelligence
  labels:
    app: rr-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rr-backend
  template:
    metadata:
      labels:
        app: rr-backend
    spec:
      containers:
      - name: backend
        image: royals-intelligence/backend:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: rr-intelligence-config
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rr-backend-service
  namespace: royals-intelligence
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: rr-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rr-intelligence-frontend
  namespace: royals-intelligence
  labels:
    app: rr-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rr-frontend
  template:
    metadata:
      labels:
        app: rr-frontend
    spec:
      containers:
      - name: frontend
        image: royals-intelligence/frontend:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rr-frontend-service
  namespace: royals-intelligence
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: rr-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rr-intelligence-ingress
  namespace: royals-intelligence
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - intelligence.rajasthanroyals.com
    secretName: rr-intelligence-tls
  rules:
  - host: intelligence.rajasthanroyals.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: rr-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rr-frontend-service
            port:
              number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rr-backend-hpa
  namespace: royals-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rr-intelligence-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
